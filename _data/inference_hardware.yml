# Model and GPU reference data for the inference VRAM calculator.
# Model figures are from published config.json values on Hugging Face.
#   params    billions of parameters
#   layers    num_hidden_layers
#   kv_heads  num_key_value_heads (fewer than attention heads under GQA)
#   head_dim  hidden_size / num_attention_heads

