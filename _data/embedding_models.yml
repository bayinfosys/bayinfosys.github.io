# Embedding model dimensions for the storage calculator.
# max_tokens is the model's input limit, which bounds usable chunk size.

text_models:
  - name: "all-MiniLM-L6-v2"
    dims: 384
    max_tokens: 256
    vectors_per_item: 1
    unit: chunk
  - name: "bge-small-en-v1.5"
    dims: 384
    max_tokens: 512
    vectors_per_item: 1
    unit: chunk
  - name: "bge-base-en-v1.5"
    dims: 768
    max_tokens: 512
    vectors_per_item: 1
    unit: chunk
  - name: "nomic-embed-text-v1.5"
    dims: 768
    max_tokens: 8192
    vectors_per_item: 1
    unit: chunk
  - name: "gte-base-en-v1.5"
    dims: 768
    max_tokens: 8192
    vectors_per_item: 1
    unit: chunk
  - name: "bge-large-en-v1.5"
    dims: 1024
    max_tokens: 512
    vectors_per_item: 1
    unit: chunk
  - name: "mxbai-embed-large-v1"
    dims: 1024
    max_tokens: 512
    vectors_per_item: 1
    unit: chunk
  - name: "jina-embeddings-v3"
    dims: 1024
    max_tokens: 8192
    vectors_per_item: 1
    unit: chunk
  - name: "Qwen3-Embedding-0.6B"
    dims: 1024
    max_tokens: 32768
    vectors_per_item: 1
    unit: chunk
  - name: "Cohere embed-english-v3"
    dims: 1024
    max_tokens: 512
    vectors_per_item: 1
    unit: chunk
  - name: "OpenAI text-embedding-3-small"
    dims: 1536
    max_tokens: 8191
    vectors_per_item: 1
    unit: chunk
  - name: "OpenAI text-embedding-ada-002"
    dims: 1536
    max_tokens: 8191
    vectors_per_item: 1
    unit: chunk
  - name: "OpenAI text-embedding-3-large"
    dims: 3072
    max_tokens: 8191
    vectors_per_item: 1
    unit: chunk
  - name: "Qwen3-Embedding-8B"
    dims: 4096
    max_tokens: 32768
    vectors_per_item: 1
    unit: chunk
  - name: "ColBERTv2 (late interaction)"
    dims: 128
    max_tokens: 512
    vectors_per_item: 130
    unit: passage
    note: "One vector per token. Roughly 22x single-vector storage at 768d."
  - name: "answerai-colbert-small-v1"
    dims: 96
    max_tokens: 512
    vectors_per_item: 130
    unit: passage
    note: "Smaller late-interaction model. Still one vector per token."


image_models:
  - name: "CLIP ViT-B/32"
    dims: 512
    vectors_per_item: 1
    unit: image
  - name: "CLIP ViT-L/14"
    dims: 768
    vectors_per_item: 1
    unit: image
  - name: "OpenCLIP ViT-H/14"
    dims: 1024
    vectors_per_item: 1
    unit: image
  - name: "SigLIP base"
    dims: 768
    vectors_per_item: 1
    unit: image
  - name: "SigLIP So400m"
    dims: 1152
    vectors_per_item: 1
    unit: image
  - name: "DINOv2 ViT-B/14"
    dims: 768
    vectors_per_item: 1
    unit: image
  - name: "DINOv2 ViT-g/14"
    dims: 1536
    vectors_per_item: 1
    unit: image
  - name: "Jina CLIP v2"
    dims: 1024
    vectors_per_item: 1
    unit: image
  - name: "Nomic Embed Vision v1.5"
    dims: 768
    vectors_per_item: 1
    unit: image
  - name: "Amazon Titan Multimodal"
    dims: 1024
    vectors_per_item: 1
    unit: image
  - name: "ColPali (late interaction)"
    dims: 128
    vectors_per_item: 1030
    unit: page
    note: "One vector per image patch. Roughly 170x single-vector storage."
  - name: "ColQwen2 (late interaction)"
    dims: 128
    vectors_per_item: 1030
    unit: page
    note: "As ColPali, with a Qwen2-VL backbone."
  - name: "SAM ViT-H image encoder"
    dims: 256
    vectors_per_item: 4096
    unit: image
    note: "A 256x64x64 feature map, not a retrieval embedding. 4 MiB per image at float32."

# Dimension values used in the comparison matrix.
comparison_dims: [384, 768, 1024, 1536, 3072, 4096]

# Chunk sizes used in the chunking comparison.
comparison_chunks: [128, 256, 512, 1024, 2048]


units:
  chunk:   { payload_label: "Chunk text",  default_payload_bytes: 2048 }
  passage: { payload_label: "Passage text", default_payload_bytes: 2048 }
  image:   { payload_label: "Thumbnail",   default_payload_bytes: 40960 }
  page:    { payload_label: "Page image",  default_payload_bytes: 122880 }

comparison_vectors: [1, 130, 256, 1030, 4096]
