---
layout: default
---

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | escape }}",
  "keywords": "{{ page.keywords | join: ', ' }}",
  "url": "{{ page.url | absolute_url }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "publisher": {
    "@type": "Organization",
    "name": "Bay Information Systems",
    "url": "https://www.bayis.co.uk"
  },
  "author": {
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.author.url }}"
  }
}
</script>

<main class="container py-5">
  <article class="container">
    {{ content }}
  </article>

  {% include related.html %}

  <hr id="article-end" class="mt-5">
  {% if page.cta %}
  {% assign cl = site.checklists | where: "slug", page.cta | first %}
  <p class="text-muted">(Checklist: <a href="{{ cl.url }}">{{ cl.title }}</a>. {{ cl.description }})</p>
  {% endif %}
  <p class="text-muted">Questions about this? <a href="/contact.html">Get in touch.</a></p>
</main>
