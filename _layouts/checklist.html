---
layout: default
---
{% assign d = site.data[page.slug] %}

{% if d.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for f in d.faq %}
    {
      "@type": "Question",
      "name": {{ f.q | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ f.a | jsonify }} }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}

<script type="application/json" id="checklist-config">{"bands": {{ d.bands | jsonify }}, "flags": {{ d.flags | jsonify }}}</script>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8" data-checklist="{{ page.slug }}">
      {{ content }}
    </div>
  </div>
</main>

{% include checklist/templates.html %}
<script src="/assets/render.js"></script>
<script src="/assets/checklist.js"></script>
