<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://www.dev.clientlog.bayis.co.uk">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.seo_title %}{{ page.seo_title }} | Bay Information Systems{% elsif page.title %}{{ page.title }} | Bay Information Systems{% else %}Bay Information Systems | AI/ML Consultancy{% endif %}</title>

  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Bay Information Systems offers AI/ML consultancy and engineering services for startups and enterprises.{% endif %}">
  {% if page.keywords %}
  <meta name="keywords" content="{{ page.keywords | join: ', ' }}">
  {% endif %}
  <link rel="canonical" href="{{ page.url | prepend: 'https://www.bayis.co.uk' | replace: 'index.html', '' }}">
  {% if page.noindex %}
  <meta name="robots" content="noindex, follow">
  {% endif %}

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

{% include nav.html %}

{{ content }}

{% include footer.html %}

{% include schema-organisation.html %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.dev.clientlog.bayis.co.uk/clientlog.js"></script>
<script>
  const logger = clientlog.createLogger({
    endpoint: "https://api.dev.clientlog.bayis.co.uk/v1/event",
    project: "bayis/home"
  });
</script>

</body>
</html>
