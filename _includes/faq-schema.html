{% if include.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for f in include.faq %}
    {
      "@type": "Question",
      "name": {{ f.q | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ f.a | jsonify }} }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
